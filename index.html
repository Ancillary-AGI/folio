<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preload" href="/fonts/Archivo-Variable.ttf" as="font" type="font/ttf" crossorigin />
    <meta name="application-name" content="Folio" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07080D" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta
      name="description"
      content="Folio is an engineering workbench for circuit, board, mechanical, robotics and RF design — with tested simulation from schematic to manufacture."
    />
    <title>Folio — Engineering Workbench</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      /*
       * Pre-paint theme bootstrap.
       *
       * main.tsx applies the full token set, but that runs after the bundle is
       * parsed. This tiny script only needs to stop the white flash, so it sets
       * `color-scheme` and the two possible background colours and nothing else.
       * The hex literals must equal `THEMES['folio-dark']['--background']` and
       * `THEMES.light['--background']` in src/lib/theme/tokens.ts.
       */
      (function () {
        var key = 'circuit-cad-app-store';
        var preference = 'folio-dark';
        try {
          var raw = localStorage.getItem(key);
          if (raw) {
            var parsed = JSON.parse(raw);
            var stored = parsed && parsed.state && parsed.state.settings && parsed.state.settings.theme;
            if (stored) preference = stored;
          }
        } catch (error) {
          /* storage disabled — use Folio Dark default */
        }
        var prefersDark = false;
        var prefersContrast = false;
        try {
          prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          prefersContrast = window.matchMedia('(prefers-contrast: more)').matches;
        } catch (error) {
          /* no matchMedia — explicit preference remains Folio Dark */
        }
        var theme =
          preference === 'system'
            ? prefersContrast
              ? 'high-contrast'
              : prefersDark
                ? 'folio-dark'
                : 'light'
            : preference;
        var isDark = theme !== 'light';
        var root = document.documentElement;
        root.dataset.theme = theme;
        if (isDark) root.classList.add('dark');
        root.style.colorScheme = isDark ? 'dark' : 'light';
        /* Exact THEMES[*]['--background'] tokens from src/lib/theme/tokens.ts:
           light #ffffff, dark #0a0f1a, folio-dark #07080d, professional (spreads dark) #0a0f1a, high-contrast #000000.
           theme.test.ts pins every one of these literals. */
        var backgrounds = {
          'light': '#ffffff',
          'dark': '#0a0f1a',
          'folio-dark': '#07080d',
          'professional': '#0a0f1a',
          'high-contrast': '#000000',
        };
        root.style.backgroundColor = backgrounds[theme] || '#07080d';
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
