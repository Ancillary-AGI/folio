<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07080D" />
    <meta
      name="description"
      content="Your Folio account: profile, usage from this device's ledger, plan and limits, and a copy of your local data."
    />
    <title>Console — Folio</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      /*
       * Pre-paint theme bootstrap, identical in behaviour to the workbench's so
       * the console never flashes white. The hex literals must equal
       * `THEMES['folio-dark']['--background']` and `THEMES.light['--background']` in
       * src/lib/theme/tokens.ts — theme.test.ts asserts that.
       */
      (function () {
        var key = 'circuit-cad-app-store';
        var preference = 'dark';
        try {
          var raw = localStorage.getItem(key);
          if (raw) {
            var parsed = JSON.parse(raw);
            var stored = parsed && parsed.state && parsed.state.settings && parsed.state.settings.theme;
            if (stored) preference = stored;
          }
        } catch (error) {
          /* storage disabled — use the Dark CAD default */
        }
        var prefersDark = false;
        var prefersContrast = false;
        try {
          prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          prefersContrast = window.matchMedia('(prefers-contrast: more)').matches;
        } catch (error) {
          /* no matchMedia — explicit preference remains Dark */
        }
        var theme =
          preference === 'system'
            ? prefersContrast
              ? 'high-contrast'
              : prefersDark
                ? 'dark'
                : 'light'
            : preference;
        var isDark = theme !== 'light';
        var root = document.documentElement;
        root.dataset.theme = theme;
        if (isDark) root.classList.add('dark');
        root.style.colorScheme = isDark ? 'dark' : 'light';
        root.style.backgroundColor = isDark ? '#07080d' : '#ffffff';
      })();
    </script>
    <script type="module" src="/src/console/main.tsx"></script>
  </body>
</html>
